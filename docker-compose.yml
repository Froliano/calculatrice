services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calculatrice
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: calculatrice
      DB_USER: user
      DB_PASSWORD: password
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

  test-js:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    profiles: ["test"]

  test-python:
    build: ./tests
    environment:
      - BASE_URL=http://backend:8000
    depends_on:
      - backend
    profiles: ["test"]

volumes:
  db_data:
